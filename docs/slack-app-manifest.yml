display_information:
  name: SlackMinecraft
  description: Minecraft chat and server events in Slack
features:
  bot_user:
    display_name: Minecraft
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - users:read
      - channels:read
      - channels:history
      - groups:read
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
