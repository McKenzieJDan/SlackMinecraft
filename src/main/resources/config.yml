# Create a bot at https://my.slack.com/services/new/bot and paste token here.

slack:
  enabled: true
  token: ""
  app-token: ""
  channel: "general"
  icon: "https://www.minecraft.net/favicon.ico"
  debug: false
  cacheRefreshMinutes: 60

